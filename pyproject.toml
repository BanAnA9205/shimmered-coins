[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shimmered-coins"
version = "0.1.0"
description = "Search engine for coin-producing buy/craft/shimmer/sell sequences in Terraria"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "highspy>=1.7"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
shimcoins = "shimmered_coins.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
shimmered_coins = ["demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: frozen-dataclass defaults are fine; B905: zip strictness is noise here
ignore = ["B008", "B905"]
