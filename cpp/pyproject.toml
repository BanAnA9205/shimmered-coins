[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "shimmered-coins-core"
version = "0.1.0"
description = "C++ search core for shimmered-coins (optional accelerator)"
requires-python = ">=3.10"

[tool.scikit-build]
wheel.packages = ["python/shimmered_coins_core"]
cmake.build-type = "Release"
